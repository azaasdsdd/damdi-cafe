<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F5F0E8">
    <title>Dәмді Cafe</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #F5F0E8;
            font-family: Arial, sans-serif;
            color: #39291F;
        }

        .app {
            max-width: 600px;
            margin: auto;
            padding: 35px 22px;
            min-height: 100vh;
        }

        h2 {
            font-size: 25px;
            font-weight: 600;
            letter-spacing: -1px;
        }

        h1 {
            font-size: 38px;
            margin-top: 110px;
            letter-spacing: -1px;
        }

        p {
            color: #927D69;
            font-size: 15px;
        }

        .search {
            display: flex;
            align-items: center;
            background: white;
            padding: 8px;
            border-radius: 16px;
            margin-top: 30px;
            box-shadow: 0 5px 25px rgba(57, 41, 31, 0.06);
        }

        input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            padding: 12px;
            font-size: 16px;
            background: transparent;
            color: #39291F;
        }

        button {
            background: #493528;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #674936;
        }
    </style>
</head>

<body>

    <div class="app">

        <h2>Dәмді Cafe</h2>

        <h1>Іздеу</h1>

        <p>Өзіңізге керекті тағамды табыңыз</p>

        <div class="search">
            <input
                type="text"
                id="searchInput"
                placeholder="Тағам іздеу..."
            >

            <button onclick="searchFood()">
                Іздеу →
            </button>
        </div>

    </div>

    <script>
        function searchFood() {
            let value = document.getElementById("searchInput").value.trim();

            if (value === "") {
                alert("Тағам атауын жазыңыз!");
            } else {
                alert("Сіз іздедіңіз: " + value);
            }
        }
    </script>

</body>
</html>
